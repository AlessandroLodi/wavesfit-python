name: Python validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q
      - run: python -m ruff check src tests scripts
      - run: python -m build
      - run: python scripts/check_wheel.py
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          name: python-distributions
          path: dist/*
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - run: python -m pip install '.[dev]'
      - uses: actions/checkout@v4
        with:
          repository: AlessandroLodi/wavesfit-go
          path: peer-go
      - run: python scripts/sync_go.py --target peer-go --check
      - run: go build -o ../wavesfit-go-bin ./cmd/wavesfit-go
        working-directory: peer-go
      - run: python scripts/compare_go.py --go-binary ./wavesfit-go-bin
